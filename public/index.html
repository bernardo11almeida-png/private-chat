<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrivateChat</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // Aplica o tema salvo antes de pintar a pagina, pra evitar "flash" de tema errado.
    (function () {
      var theme = localStorage.getItem('pc_theme') || 'dark';
      var accent = localStorage.getItem('pc_accent');
      document.documentElement.setAttribute('data-theme', theme);
      if (accent) document.documentElement.style.setProperty('--accent', accent);
    })();
  </script>
</head>
<body>

  <!-- ===== Tela de autenticacao (login / registro) ===== -->
  <div id="auth-screen" class="screen">
    <div class="auth-card">
      <h1 class="brand">PrivateChat</h1>

      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Entrar</button>
        <button class="tab-btn" data-tab="register">Criar conta</button>
      </div>

      <form id="login-form" class="auth-form">
        <input type="text" id="login-username" placeholder="Usuario" required />
        <input type="password" id="login-password" placeholder="Senha" required />
        <button type="submit">Entrar</button>
        <p class="form-error" id="login-error"></p>
      </form>

      <form id="register-form" class="auth-form hidden">
        <input type="text" id="register-username" placeholder="Usuario" required />
        <input type="text" id="register-display-name" placeholder="Nome de exibicao" required />
        <input type="password" id="register-password" placeholder="Senha" required />
        <button type="submit">Criar conta</button>
        <p class="form-error" id="register-error"></p>
      </form>
    </div>
  </div>

  <!-- ===== Aplicativo principal ===== -->
  <div id="app-screen" class="screen hidden">
    <aside class="sidebar">
      <div class="sidebar-top">
        <button class="nav-btn active" data-view="home" title="Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          <span>Home</span>
        </button>
        <button class="nav-btn" data-view="friends" title="Friends">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><circle cx="17.5" cy="8.5" r="2.8"/><path d="M15 13.6c2.9.5 5 2.9 5 6.4"/></svg>
          <span>Friends</span>
        </button>
        <button class="nav-btn" data-view="users" title="Users">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
          <span>Users</span>
        </button>
      </div>
      <div class="sidebar-bottom">
        <button class="nav-btn" data-view="settings" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9c.3.6.9 1 1.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
          <span>Settings</span>
        </button>
      </div>
    </aside>

    <main class="main-area">

      <!-- HOME: perfil do usuario -->
      <section id="view-home" class="view">
        <div class="profile-card">
          <div class="profile-banner" id="profile-banner-el"></div>
          <div class="profile-card-body">
            <img id="profile-avatar" class="avatar avatar-lg avatar-overlap" src="" alt="avatar" />
            <h2 id="profile-display-name"></h2>
            <p id="profile-username" class="muted"></p>
            <p id="profile-serial" class="serial-id"></p>
            <p id="profile-bio" class="bio"></p>
          </div>
        </div>
      </section>

      <!-- FRIENDS -->
      <section id="view-friends" class="view hidden">
        <div class="panel">
          <h2>Adicionar amigo</h2>
          <div class="add-friend-row">
            <input type="text" id="friend-serial-input" placeholder="Enter Serial ID... (#000000000)" />
            <button id="send-friend-request-btn">Enviar</button>
          </div>
          <p class="form-error" id="add-friend-error"></p>

          <h3>Solicitacoes recebidas</h3>
          <ul id="friend-requests-list" class="simple-list"></ul>

          <h3>Solicitacoes enviadas</h3>
          <ul id="friend-requests-outgoing-list" class="simple-list"></ul>

          <h3>Meus amigos</h3>
          <ul id="friends-list" class="simple-list"></ul>
        </div>
      </section>

      <!-- USERS: busca por serial id -->
      <section id="view-users" class="view hidden">
        <div class="panel">
          <h2>Buscar usuario</h2>
          <div class="add-friend-row">
            <input type="text" id="user-search-input" placeholder="Enter Serial ID... (#000000000)" />
            <button id="user-search-btn">Buscar</button>
          </div>
          <div id="user-search-result"></div>
        </div>
      </section>

      <!-- SETTINGS -->
      <section id="view-settings" class="view hidden">
        <div class="panel panel-wide">
          <h2>Editar perfil</h2>

          <div class="upload-row">
            <div class="upload-box">
              <label class="field-label">Banner</label>
              <div class="banner-preview" id="banner-preview"></div>
              <div class="upload-actions">
                <label class="btn-secondary file-btn">
                  Trocar banner
                  <input type="file" id="banner-input" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
                </label>
                <button type="button" id="remove-banner-btn" class="btn-secondary">Remover</button>
              </div>
            </div>

            <div class="upload-box">
              <label class="field-label">Foto de perfil</label>
              <img id="avatar-preview" class="avatar avatar-lg" src="" alt="avatar" />
              <div class="upload-actions">
                <label class="btn-secondary file-btn">
                  Trocar foto
                  <input type="file" id="avatar-input" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
                </label>
                <button type="button" id="remove-avatar-btn" class="btn-secondary">Remover</button>
              </div>
            </div>
          </div>
          <p class="form-error" id="upload-error"></p>

          <form id="settings-form">
            <label class="field-label">Nome de exibicao</label>
            <input type="text" id="settings-display-name" />

            <label class="field-label">Bio</label>
            <textarea id="settings-bio" rows="3"></textarea>

            <button type="submit">Salvar alteracoes</button>
            <p class="form-success" id="settings-success"></p>
          </form>

          <h2 class="section-title">Aparencia</h2>
          <label class="field-label">Tema</label>
          <div class="theme-grid" id="theme-grid">
            <button type="button" class="theme-swatch" data-theme="dark">
              <span class="swatch-preview swatch-dark"></span> Escuro
            </button>
            <button type="button" class="theme-swatch" data-theme="light">
              <span class="swatch-preview swatch-light"></span> Claro
            </button>
            <button type="button" class="theme-swatch" data-theme="midnight">
              <span class="swatch-preview swatch-midnight"></span> Meia-noite
            </button>
            <button type="button" class="theme-swatch" data-theme="forest">
              <span class="swatch-preview swatch-forest"></span> Floresta
            </button>
          </div>

          <label class="field-label">Cor de destaque</label>
          <div class="accent-row">
            <input type="color" id="accent-input" value="#5865f2" />
            <button type="button" id="accent-reset-btn" class="btn-secondary">Restaurar padrao</button>
          </div>

          <button id="logout-btn" class="logout-btn">Sair da conta</button>
        </div>
      </section>

      <!-- CHAT -->
      <section id="view-chat" class="view hidden">
        <div class="chat-layout">
          <div class="chat-friend-list">
            <h3>Conversas</h3>
            <ul id="chat-friends-list" class="simple-list"></ul>
          </div>
          <div class="chat-window">
            <div id="chat-empty" class="chat-empty">Selecione um amigo para conversar</div>
            <div id="chat-active" class="chat-active hidden">
              <div class="chat-header">
                <img id="chat-header-avatar" class="avatar" src="" alt="" />
                <div>
                  <div id="chat-header-name"></div>
                  <div id="chat-header-status" class="muted small">● Offline</div>
                </div>
              </div>
              <div id="chat-messages" class="chat-messages"></div>
              <form id="chat-form" class="chat-input-row">
                <input type="text" id="chat-input" placeholder="Digite uma mensagem..." autocomplete="off" />
                <button type="submit">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
                </button>
              </form>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- ===== Popout de perfil (estilo Discord) ===== -->
  <div id="profile-modal" class="modal-backdrop hidden">
    <div class="profile-modal-card">
      <button id="profile-modal-close" class="modal-close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
      </button>
      <div class="profile-banner" id="modal-banner"></div>
      <div class="profile-card-body">
        <img id="modal-avatar" class="avatar avatar-lg avatar-overlap" src="" alt="avatar" />
        <h2 id="modal-display-name"></h2>
        <p id="modal-username" class="muted"></p>
        <p id="modal-serial" class="serial-id"></p>
        <p id="modal-bio" class="bio"></p>
        <div id="modal-actions" class="modal-actions"></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
